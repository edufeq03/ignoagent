[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ignoagent"
version = "0.1.0"
description = "Ignotec Infrastructure Agent"
requires-python = ">=3.10"

dependencies = [
    "psutil",
    "PyYAML",
    "packaging"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ignoagent*"]
